[package]
name = "oanim-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "oanim_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38", "extension-module"] }
numpy = "0.29"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
